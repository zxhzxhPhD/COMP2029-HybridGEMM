[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hygemm-vllm-integration"
version = "0.1.0"
description = "Pinned vLLM integration for SM120 HyGEMM and the original MixLLM kernels"
requires-python = ">=3.11"

[project.entry-points."vllm.general_plugins"]
hygemm_quantization = "hygemm_vllm:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["hygemm_vllm*"]
